<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Investor Agent Skills</title>
  <desc id="desc">Curated through the GenCreator 6-Pillar CoE lens • Starlight Swarm • Arcanea Creative Execution • Agentic Passive Income Systems</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500">
      <stop stop-color="#1a1a2e"/>
      <stop offset="0.5" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="100" x2="1420" y2="420">
      <stop stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <!-- Investor elements: trend lines, charts -->
  <g opacity="0.25" stroke="url(#accent)" stroke-width="2">
    <path d="M200 380 Q400 280 600 380 Q800 480 1000 380 Q1200 280 1400 380"/>
    <path d="M300 300 L400 260 L500 310 L600 240 L700 290 L800 250 L900 320 L1000 270 L1100 310 L1200 260" stroke="#00d4ff" stroke-width="3"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="350" cy="280" r="12" fill="#00d4ff"/>
    <circle cx="750" cy="330" r="10" fill="#00b4d8"/>
    <circle cx="1150" cy="290" r="11" fill="#0077b6"/>
  </g>
  <text x="120" y="220" fill="#f0f4f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Awesome Investor</text>
  <text x="122" y="285" fill="#e0e7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Agent Skills</text>
  <text x="124" y="340" fill="#a5b4fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="0">Polymarket • Agentic Investing • Risk Agents • 6-Pillar Governance</text>
  <text x="980" y="420" fill="#00d4ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">| GenCreator 6-Pillar</text>
</svg>