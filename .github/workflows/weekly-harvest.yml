name: Weekly harvest

# Every Monday: search GitHub for investing skills, MCP servers and research tools, classify their
# licences, and open a PULL REQUEST with the report for review. Nothing is merged automatically and
# nothing enters data/repos.json without a reviewer.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate before harvesting
        run: node scripts/validate-catalog.mjs

      - name: Harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harvest.mjs --limit 30

      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs="$(gh pr list --state open --limit 100 --json number --jq 'length')"
          if [ "$open_prs" -ge 10 ]; then
            echo "PR budget exhausted; harvest remains available in job artifacts for owner review."
            exit 1
          fi
          week="$(date -u +%G-W%V)"
          if git diff --quiet -- data/candidates.json && [ -z "$(git status --porcelain reports)" ]; then
            echo "Nothing new this week."
            exit 0
          fi
          branch="agent/harvest/$week-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/candidates.json "reports/$week.md"
          git commit -m "chore(harvest): weekly candidates $week"
          git push -u origin "$branch"
          if ! gh pr create --draft --base main --head "$branch" --title "Weekly harvest $week" --body-file "reports/$week.md"; then
            # The owner controls Actions PR permissions. Fail visibly without issue spam.
            echo "Draft PR creation failed; inspect repository Actions permissions."
            exit 1
          fi
